name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # v1.5.2 P0: 测试环境必须确定 — Pester 固定 5.9.0 (不装 latest, 防止 6.x/未来大版本漂移)
  PESTER_VERSION: '5.9.0'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 既有单元测试 (PS 5.1, 自研 Assert-Equal, 不依赖 Pester)
      - name: Unit tests (PS 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-unit.ps1

      # 2. Pester 5 (Windows PowerShell 5.1)
      - name: Pester 5 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $r = Invoke-Pester tests\Pester -PassThru
          if ($r.FailedCount -gt 0) { throw "Pester PS5.1 failed: $($r.FailedCount)" }

      # 3. Pester 5 (PowerShell 7)
      - name: Pester 5 (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $r = Invoke-Pester tests/Pester -PassThru
          if ($r.FailedCount -gt 0) { throw "Pester PS7 failed: $($r.FailedCount)" }

      # 3b. GUI 无窗口测试 (v1.5.3: GUI 是主要入口, WPF XAML/轮询/统计必须受保护; STA 必须)
      - name: GUI tests (WPF 无窗口, STA)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          powershell -STA -NoProfile -ExecutionPolicy Bypass -File tests/run-gui-tests.ps1

      # 4. PSScriptAnalyzer (静态分析, 报 Error 级问题即失败)
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          Import-Module PSScriptAnalyzer
          $all = @()
          foreach ($f in @('cpu-cleaner.ps1','gui-cleaner.ps1') + @(Get-ChildItem src/Core -Filter *.ps1 | ForEach-Object { $_.FullName })) { $all += @(Invoke-ScriptAnalyzer -Path $f -Severity Error) }
          if ($all) { $all | Format-Table; throw "PSScriptAnalyzer found $($all.Count) error(s)" }

      # 5. 特征库 schema 校验 (v1.6.0: v3 + match_type 合法)
      - name: Profile schema validation
        shell: pwsh
        run: |
          $p = Get-Content bloatware-profiles.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($p.schema_version -ne 3) { throw "schema_version must be 3, got $($p.schema_version)" }
          $ids = @($p.profiles | ForEach-Object { $_.id })
          $dup = $ids | Group-Object | Where-Object { $_.Count -gt 1 }
          if ($dup) { throw "duplicate ids: $($dup.Name -join ', ')" }
          $validActions = @('disable_service','remove_autostart','disable_task','uninstall','investigate','none')
          $validTypes = @('exact','contains','regex','path','publisher','sha256')
          foreach ($rule in $p.profiles) {
            foreach ($ak in $rule.actions.PSObject.Properties.Name) {
              if ($validActions -notcontains $rule.actions.$ak) { throw "rule $($rule.id) has invalid action: $($rule.actions.$ak)" }
            }
            foreach ($dk in @('services','processes','autostarts','tasks')) {
              foreach ($item in @($rule.detect.$dk)) {
                $t = if ($item -is [string]) { 'contains' } elseif ($item.type) { [string]$item.type } else { 'contains' }
                if ($validTypes -notcontains $t) { throw "rule $($rule.id) detect.$dk invalid match_type: $t" }
                $m = if ($item -is [string]) { $item } elseif ($item.match) { [string]$item.match } else { '' }
                if (-not $m) { throw "rule $($rule.id) detect.$dk empty match" }
              }
            }
            if ($rule.execution -and $rule.execution.allow_auto -isnot [bool]) { throw "rule $($rule.id) execution.allow_auto must be boolean" }
          }
          Write-Output "Schema validation OK: $($p.profiles.Count) rules (v3)"
